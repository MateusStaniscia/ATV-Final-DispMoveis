name: Flutter e Firebase
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --debug --dart-define=USE_FIREBASE_EMULATORS=true
      - run: flutter build apk --debug --dart-define=USE_FIREBASE_EMULATORS=true
      - run: npm ci
      - run: npm run test:firebase
